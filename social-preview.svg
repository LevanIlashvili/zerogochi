<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" shape-rendering="crispEdges">
  <!-- ============================================================
       Zerogochi social preview · 1280×640 · 4-color GB DMG palette
       ============================================================ -->

  <!-- Background — outside the LCD area is black device shell -->
  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- Subtle scanline texture across the whole card -->
  <defs>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#000" opacity="0.15"/>
    </pattern>
    <!-- Reusable pixel grid: 1 unit = 1 logical pixel; we scale via group transforms -->
  </defs>

  <!-- LCD-style green panel filling the left half -->
  <g>
    <!-- Outer dark border (darkest green) -->
    <rect x="40" y="40" width="540" height="560" fill="#0f380f"/>
    <!-- Inner LCD (lightest green) -->
    <rect x="60" y="60" width="500" height="520" fill="#9bbc0f"/>
    <rect x="60" y="60" width="500" height="520" fill="url(#scanlines)" opacity="0.5"/>
  </g>

  <!-- ============================================================
       Pet sprite · 24×24 grid · positioned in the LCD panel
       Centered around (310, 380) at 12× scale
       ============================================================ -->
  <g transform="translate(166 256) scale(12)" shape-rendering="crispEdges">
    <!-- Body outline (darkest green) -->
    <!-- top of head -->
    <rect x="9" y="3" width="6" height="1" fill="#0f380f"/>
    <rect x="7" y="4" width="2" height="1" fill="#0f380f"/>
    <rect x="15" y="4" width="2" height="1" fill="#0f380f"/>
    <rect x="6" y="5" width="1" height="1" fill="#0f380f"/>
    <rect x="17" y="5" width="1" height="1" fill="#0f380f"/>
    <rect x="5" y="6" width="1" height="1" fill="#0f380f"/>
    <rect x="18" y="6" width="1" height="1" fill="#0f380f"/>
    <rect x="4" y="7" width="1" height="9" fill="#0f380f"/>
    <rect x="19" y="7" width="1" height="9" fill="#0f380f"/>
    <rect x="5" y="16" width="1" height="1" fill="#0f380f"/>
    <rect x="18" y="16" width="1" height="1" fill="#0f380f"/>
    <rect x="6" y="17" width="1" height="1" fill="#0f380f"/>
    <rect x="17" y="17" width="1" height="1" fill="#0f380f"/>
    <rect x="7" y="18" width="2" height="1" fill="#0f380f"/>
    <rect x="15" y="18" width="2" height="1" fill="#0f380f"/>
    <rect x="9" y="19" width="6" height="1" fill="#0f380f"/>

    <!-- Body fill (light green) -->
    <rect x="9" y="4" width="6" height="1" fill="#8bac0f"/>
    <rect x="7" y="5" width="10" height="1" fill="#8bac0f"/>
    <rect x="6" y="6" width="12" height="1" fill="#8bac0f"/>
    <rect x="5" y="7" width="14" height="9" fill="#8bac0f"/>
    <rect x="6" y="16" width="12" height="1" fill="#8bac0f"/>
    <rect x="7" y="17" width="10" height="1" fill="#8bac0f"/>
    <rect x="9" y="18" width="6" height="1" fill="#8bac0f"/>

    <!-- Body shadow (dark green) — bottom curve -->
    <rect x="6" y="14" width="12" height="2" fill="#306230"/>
    <rect x="7" y="16" width="10" height="1" fill="#306230"/>
    <rect x="9" y="17" width="6" height="1" fill="#306230"/>

    <!-- Cheek dots (dark green) -->
    <rect x="6" y="11" width="1" height="1" fill="#306230"/>
    <rect x="17" y="11" width="1" height="1" fill="#306230"/>

    <!-- Eyes (darkest green) — two dots with tiny highlights -->
    <rect x="9" y="9" width="2" height="2" fill="#0f380f"/>
    <rect x="13" y="9" width="2" height="2" fill="#0f380f"/>
    <rect x="10" y="9" width="1" height="1" fill="#9bbc0f"/>
    <rect x="14" y="9" width="1" height="1" fill="#9bbc0f"/>

    <!-- Mouth — small smile -->
    <rect x="10" y="13" width="1" height="1" fill="#0f380f"/>
    <rect x="13" y="13" width="1" height="1" fill="#0f380f"/>
    <rect x="11" y="14" width="2" height="1" fill="#0f380f"/>

    <!-- Antenna -->
    <rect x="11" y="0" width="2" height="1" fill="#0f380f"/>
    <rect x="11" y="1" width="2" height="1" fill="#0f380f"/>
    <rect x="11" y="2" width="2" height="1" fill="#0f380f"/>

    <!-- Sparkle on left -->
    <rect x="1" y="6" width="1" height="1" fill="#0f380f"/>
    <rect x="0" y="7" width="1" height="1" fill="#0f380f"/>
    <rect x="2" y="7" width="1" height="1" fill="#0f380f"/>
    <rect x="1" y="8" width="1" height="1" fill="#0f380f"/>
  </g>

  <!-- ============================================================
       Speech bubble — pixel rect with tail, above pet's right shoulder
       ============================================================ -->
  <g shape-rendering="crispEdges">
    <!-- Bubble outline -->
    <rect x="280" y="100" width="280" height="100" fill="#0f380f"/>
    <!-- Bubble fill -->
    <rect x="288" y="108" width="264" height="84" fill="#9bbc0f"/>
    <!-- Tail (pointing down toward pet) -->
    <rect x="304" y="200" width="24" height="8" fill="#0f380f"/>
    <rect x="312" y="208" width="16" height="8" fill="#0f380f"/>
    <rect x="320" y="216" width="8" height="8" fill="#0f380f"/>
    <rect x="312" y="200" width="8" height="8" fill="#9bbc0f"/>
    <rect x="320" y="208" width="4" height="4" fill="#9bbc0f"/>

    <!-- Bubble text — "i remember everything." in pixel-style monospace -->
    <text
      x="304" y="146"
      font-family="'Silkscreen','Press Start 2P', ui-monospace, monospace"
      font-size="20"
      font-weight="700"
      fill="#0f380f"
      letter-spacing="1">
      i remember
    </text>
    <text
      x="304" y="178"
      font-family="'Silkscreen','Press Start 2P', ui-monospace, monospace"
      font-size="20"
      font-weight="700"
      fill="#0f380f"
      letter-spacing="1">
      everything.
    </text>
  </g>

  <!-- ============================================================
       Right side — wordmark + tagline + tiny stat bars
       ============================================================ -->
  <g>
    <!-- Wordmark "ZEROGOCHI" in pixel-block style -->
    <text
      x="640" y="290"
      font-family="'Press Start 2P', ui-monospace, monospace"
      font-size="64"
      fill="#9bbc0f"
      letter-spacing="2">
      ZEROGOCHI
    </text>

    <!-- Tagline 1 -->
    <text
      x="640" y="350"
      font-family="'Silkscreen','Press Start 2P', ui-monospace, monospace"
      font-size="22"
      font-weight="700"
      fill="#8bac0f"
      letter-spacing="1.5">
      8-bit pet · iNFT on 0G · sealed AI compute
    </text>

    <!-- Tagline 2 -->
    <text
      x="640" y="384"
      font-family="'Silkscreen','Press Start 2P', ui-monospace, monospace"
      font-size="22"
      font-weight="700"
      fill="#8bac0f"
      letter-spacing="1.5">
      it reads its own onchain history
    </text>

    <!-- Tagline 3 -->
    <text
      x="640" y="418"
      font-family="'Silkscreen','Press Start 2P', ui-monospace, monospace"
      font-size="22"
      font-weight="700"
      fill="#8bac0f"
      letter-spacing="1.5">
      and remembers how you've treated it
    </text>

    <!-- Decorative stat bars (heart/sun/bolt suggested by colors) -->
    <g transform="translate(640 460)">
      <!-- Bar 1 — full -->
      <rect x="0" y="0" width="240" height="22" fill="#0f380f"/>
      <rect x="4" y="4" width="232" height="14" fill="#9bbc0f"/>
      <rect x="4" y="4" width="232" height="14" fill="#306230"/>

      <!-- Bar 2 — 80% -->
      <rect x="0" y="32" width="240" height="22" fill="#0f380f"/>
      <rect x="4" y="36" width="232" height="14" fill="#9bbc0f"/>
      <rect x="4" y="36" width="186" height="14" fill="#306230"/>

      <!-- Bar 3 — 50% -->
      <rect x="0" y="64" width="240" height="22" fill="#0f380f"/>
      <rect x="4" y="68" width="232" height="14" fill="#9bbc0f"/>
      <rect x="4" y="68" width="116" height="14" fill="#306230"/>
    </g>
  </g>

  <!-- Bottom-right footer -->
  <text
    x="1240" y="606"
    text-anchor="end"
    font-family="'Silkscreen','Press Start 2P', ui-monospace, monospace"
    font-size="16"
    font-weight="700"
    fill="#306230"
    letter-spacing="1.5">
    chain id 16661 · 0g mainnet
  </text>

  <!-- Top-right brand dot -->
  <g>
    <circle cx="1240" cy="46" r="6" fill="#ff3838"/>
    <circle cx="1240" cy="46" r="3" fill="#ff7878"/>
  </g>
</svg>
